<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
    <header>
      <h3>🧩 your name</h3>
      <nav>
        <a href="home.html">Home</a> / <a href="projects.html">Projects</a> /
        <a href="articles.html">Articles</a> /
        <a href="#">Contact</a>
      </nav>
    </header>
    <hr />
    <main>
      <h1>Contact Us!</h1>
      <p>Contact your team without them having to know your email address.</p>
      <hr />
      <hr />
      <form action="https://" target="_top" method="POST">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" required />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
          <p>We usually respond within 1-2 business days.</p>
        </div>
        <div>
          <button type="submit">Send</button>
        </div>
      </form>
    </main>
  </body>
</html>
